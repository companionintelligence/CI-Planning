<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Companion Planning — private, local-first todo & planning with optional local-LLM triage." />
    <meta name="theme-color" content="#041620" />
    <title>Companion Planning</title>
    <!-- Set the theme class before first paint to avoid a flash. Preference is
         'light' | 'dark' | 'system' under key 'vite-ui-theme'; 'system' follows
         the OS scheme, and any missing/invalid value defaults dark (dark-first). -->
    <script>
      (function () {
        function prefersDark() {
          return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        var dark = true; // dark-first default when nothing valid is stored
        try {
          var t = localStorage.getItem('vite-ui-theme');
          if (t === 'light') dark = false;
          else if (t === 'dark') dark = true;
          else if (t === 'system') dark = prefersDark();
        } catch (e) { /* localStorage unavailable */ }
        var el = document.documentElement;
        el.classList.toggle('dark', dark);
        el.classList.toggle('light', !dark);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
