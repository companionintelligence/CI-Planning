<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Companion Planning — private, local-first todo & planning with optional local-LLM triage." />
    <meta name="theme-color" content="#041620" />
    <title>Companion Planning</title>
    <!-- Set the theme class before first paint to avoid a flash. The script lives in
         public/theme-init.js (not inline) so the server's Content-Security-Policy can
         say `script-src 'self'` without an inline allowance or a per-build hash. It is a
         classic blocking script, so it still runs before the first paint. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
