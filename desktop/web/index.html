<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Companion Planning</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Companion Planning</h1>
      <p>Enter the address of the Companion Planning server you run. You can change it later from the Server menu.</p>
      <form id="connect-form">
        <label for="server">Server address</label>
        <input
          id="server"
          name="server"
          type="text"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="planning.example.com or 192.168.1.20:3848"
          required
        />
        <p class="hint">A bare address on your own network connects over http. Any other address uses https.</p>
        <button id="connect" type="submit">Connect</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
