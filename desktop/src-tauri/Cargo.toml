[package]
name = "companion-planning-desktop"
version = "0.1.0"
description = "The Companion Planning desktop app: the bundled web client, with a local offline cache"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Sends the client's requests natively, so they are not subject to CORS, and keeps the session
# cookie in the plugin's own jar (cookies are on by default). See client/src/lib/desktop-shell.ts.
tauri-plugin-http = "2"
# The offline cache of the server's reads (cache.rs). Bundled, so no system SQLite is needed.
rusqlite = { version = "0.41", features = ["bundled"] }
