name: Publish container

# Builds the container, runs it, screenshots its web UI as a gate, then pushes
# to GHCR. The marketplace manifest pins :latest, so every push to main republishes
# :latest (plus an immutable :sha-<short> tag).

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#     tags: ["*"]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/companionintelligence/ci-planning
  INTERNAL_PORT: "3848"

jobs:
  publish:
    name: Build, screenshot-test, publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${short}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Advisory only — a missing secret must never fail the publish. Without it
      # the build args below expand to empty, the Dockerfile ARG defaults win,
      # and we ship the same DSN-less image we always did.
      - name: Check Sentry DSN availability
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::notice::SENTRY_DSN secret is not set — publishing an image with no DSN compiled in. Error reporting stays inert (disabledReason: no-dsn)."
          else
            echo "SENTRY_DSN is set — baking it into the published image (server env + client bundle)."
          fi

      # Built WITH the DSN so the screenshot gate exercises the bundle that
      # actually ships: a configured build keeps @sentry/browser in the client
      # bundle and takes the Sentry.init path, neither of which a DSN-less build
      # has (the DSN check in client/src/lib/telemetry.ts makes the rest of the
      # module statically unreachable, so the SDK is dropped entirely).
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-planning-server@${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_RELEASE=ci-planning-client@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # The image runs NODE_ENV=production, where AUTH_MODE=test is refused at boot
        # (Phase I fail-closed guard). Run the smoke test in `standalone` — a valid
        # production mode: `/` and `/sw.js` are static (ungated) so the SPA shell still
        # renders for the screenshot; background /api calls 401 without a key, which the
        # app-agnostic screenshot gate does not depend on.
        #
        # CI_TELEMETRY=off because the image now has a real DSN baked in and this is a
        # throwaway CI container: without it every screenshot run would file its errors
        # into the production Sentry project. The switch stops both halves — the server
        # skips Sentry.init, and the client's /api/config/telemetry probe returns
        # {"enabled":false,"disabledReason":"opt-out"} so it does not init either.
        run: docker run -d --name app -e AUTH_MODE=standalone -e CI_TELEMETRY=off -p 8080:${INTERNAL_PORT} ${{ steps.meta.outputs.sha_tag }}

      - name: Wait for HTTP
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "up ($code)"; exit 0; fi
            sleep 2
          done
          echo "container never responded"; docker logs app; exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Container screenshot test
        run: |
          cd tests/container
          npm install
          npx playwright install --with-deps chromium
          APP_URL=http://localhost:8080 SCREENSHOT_PATH="$GITHUB_WORKSPACE/screenshot.png" npx playwright test

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: container-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true

      - name: Tear down container
        if: always()
        run: docker rm -f app || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # SENTRY_DSN becomes a runtime ENV the Koa server reads at start-up.
          # VITE_SENTRY_DSN is consumed during `pnpm --filter client build` — Vite
          # inlines import.meta.env.* into the bundle, so the browser half has no
          # runtime knob and must be baked here or it can never report.
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-planning-server@${{ github.sha }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_RELEASE=ci-planning-client@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
