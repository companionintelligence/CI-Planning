name: Deploy planning.ci.computer

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-planning-site.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Requires two repo secrets that this file does not set. See site/README.md.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=ci-planning --branch=main
