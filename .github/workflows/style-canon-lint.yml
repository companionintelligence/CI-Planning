name: Style canon lint

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on: [pull_request, push]
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-canon-lint:
    name: Style canon lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'
      - run: corepack enable
      # ci-lint-canon (@companionintelligence/config) reads the canon + retired list from the tokens package.
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint design canon (--primary must be the CI canon)
        run: pnpm lint:canon
