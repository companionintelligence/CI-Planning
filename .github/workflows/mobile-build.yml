name: Mobile Build

# Builds the Capacitor shells in mobile/ (see "Mobile app" in the README):
#
#   - companion-planning-android-debug-apk   an installable debug APK (`adb install`).
#                                            Signed with the throwaway debug key Gradle
#                                            generates, NOT a release key — it can never
#                                            go to the Play Store.
#   - companion-planning-ios-simulator-app   the iOS Simulator .app, zipped. Built with
#                                            code signing OFF, so it runs only in the
#                                            Simulator, never on a device.
#
# Manual only, like every other workflow in this repo (org CI policy: workflow_dispatch
# only; native runner minutes are the expensive ones). Run it by hand when a change to
# client/ or mobile/ needs a second opinion from a clean runner:
#
#   gh workflow run mobile-build.yml --repo companionintelligence/CI-Planning --ref <branch>
#
# This workflow is independent of docker-publish.yml and release tags: it publishes
# nothing, pushes nothing, and its artifacts expire after 7 days.
#
# A store-ready Android AAB / iOS .ipa needs release signing credentials and store
# listings that do not exist yet; see "What a store submission would still need" in the
# README.

on:
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @companionintelligence/* come from GitHub Packages (see .npmrc)

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'

      # Capacitor 8 needs JDK 21 and Android SDK 36 (AGP 8.13 / Gradle 8.14).
      - name: Install JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Only the client's own dependency tree: the shells below are not workspace members.
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --filter client...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Builds client/ into client/dist, the webDir both shells point at. Deliberately not
      # `pnpm build`, which writes to server/public for the container.
      - name: Build client bundle
        run: pnpm --filter client build:mobile

      - name: Install shell dependencies
        working-directory: mobile/android
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor
        working-directory: mobile/android
        run: pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: mobile/android/android
        run: ./gradlew assembleDebug

      # A build that produced an APK without the web bundle inside is a FAILED build that
      # would otherwise upload green: the app would open on a blank WebView.
      - name: Verify the APK carries the web bundle
        run: |
          APK=mobile/android/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::No debug APK produced"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/public/index.html' \
            || { echo "::error::APK has no assets/public/index.html — the client bundle was not synced"; exit 1; }
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: companion-planning-android-debug-apk
          path: mobile/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (Simulator .app)
    # Capacitor 8 needs Xcode 26+.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --filter client...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client bundle
        run: pnpm --filter client build:mobile

      - name: Install shell dependencies
        working-directory: mobile/ios
        run: pnpm install --frozen-lockfile

      # The iOS project uses Swift Package Manager (Capacitor 8 default): no CocoaPods step.
      - name: Sync Capacitor
        working-directory: mobile/ios
        run: pnpm exec cap sync ios

      # CODE_SIGNING_ALLOWED=NO: a Simulator build needs no Apple Developer account,
      # certificate or provisioning profile.
      - name: Build Simulator app (unsigned)
        working-directory: mobile/ios/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Same guard as the Android job: an .app without the bundled client is a blank screen.
      - name: Package the .app
        run: |
          APP="$RUNNER_TEMP/ios-derived-data/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP" || { echo "::error::No iOS Simulator .app produced — check the build step log."; exit 1; }
          test -f "$APP/public/index.html" \
            || { echo "::error::App.app has no public/index.html — the client bundle was not synced"; exit 1; }
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/companion-planning-ios-simulator.zip"
          ls -lh "$RUNNER_TEMP/companion-planning-ios-simulator.zip"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: companion-planning-ios-simulator-app
          path: ${{ runner.temp }}/companion-planning-ios-simulator.zip
          retention-days: 7
          if-no-files-found: error
