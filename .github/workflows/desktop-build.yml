name: Desktop Build

# Builds the Companion Planning desktop app (desktop/, Tauri 2) for macOS, Windows and Linux.
# Each job first builds the web client (client/dist, the bundle the app ships; see the
# beforeBuildCommand in desktop/src-tauri/tauri.conf.json), then compiles the app and bundles it,
# and uploads the bundles as workflow artifacts that expire after 7 days.
#
# Manual only, like every other workflow in this repo (org CI policy: workflow_dispatch only;
# hosted runner minutes are the expensive ones). Run it by hand when a change to desktop/ or
# client/ needs a clean build on all three platforms:
#
#   gh workflow run desktop-build.yml --repo companionintelligence/CI-Planning --ref <branch>
#
# It publishes nothing and pushes nothing. The bundles are not signed or notarised: a macOS build
# needs an Apple Developer ID and notarisation, and a Windows build needs a code-signing
# certificate, before anyone outside the team can open them without warnings. See desktop/README.md.

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # @companionintelligence/* come from GitHub Packages (see .npmrc)

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (.app and .dmg)
          - os: windows-latest
            label: Windows (installer)
          - os: ubuntu-latest
            label: Linux (AppImage and .deb)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Tauri's web view on Linux is WebKitGTK; these are its build dependencies.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      # The desktop's own dependencies, and the client's, which the build step needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter desktop... --filter client...
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri build runs the client's build:mobile first (beforeBuildCommand), then compiles the app.
      - name: Build the desktop app
        run: pnpm --filter desktop build

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: companion-planning-desktop-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/
          retention-days: 7
          if-no-files-found: error
