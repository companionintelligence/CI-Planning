name: CI

# Manual by owner decision: gated to workflow_dispatch-only in the August 2026
# cost pass, restored 2026-09-10, gated again 2026-10-08 (#618) and kept manual
# in the 2026-10-21 readiness pass ("test local, no GitHub Actions"). The same
# gate runs on a dev box before a merge:
#   pnpm typecheck && pnpm build && LOG_LEVEL=error GOOGLE_MODE=fixture pnpm test
# Dispatch this workflow by hand (gh workflow run ci.yml --ref <branch>) only
# when a second opinion from a clean runner is wanted.
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main, 'companion/**']
#   pull_request:
#     branches: [main]
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (client)
        run: pnpm --filter client typecheck

      - name: Build
        run: pnpm build

      - name: Unit + Integration tests
        run: pnpm test
        env:
          LOG_LEVEL: error
          GOOGLE_MODE: fixture
