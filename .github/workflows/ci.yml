name: CI

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main, 'companion/**']
#   pull_request:
#     branches: [main]
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: Typecheck + Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'

      - name: Install dependencies
        run: pnpm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (client)
        run: pnpm --filter client typecheck

      - name: Build
        run: pnpm build

      - name: Unit + Integration tests
        run: pnpm test
        env:
          LOG_LEVEL: error
          GOOGLE_MODE: fixture
