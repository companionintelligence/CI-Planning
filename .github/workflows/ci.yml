name: CI

on:
  push:
    branches: [main, 'companion/**']
  pull_request:
    branches: [main]

jobs:
  typecheck-test:
    name: Typecheck + Unit + Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (client)
        run: pnpm --filter client typecheck

      - name: Build
        run: pnpm build

      - name: Unit + Integration tests
        run: pnpm test
        env:
          LOG_LEVEL: error
          GOOGLE_MODE: fixture
