# Standalone / self-host stack for Companion Planning (ci-planning) + a bundled Ollama.
#
# This file is for running the app on your own machine or server. It is NOT used by
# the CI-Hub marketplace install — on a Hub appliance the Hub mounts /data and wires
# OLLAMA_URL automatically, so the Hub path is unchanged and ignores this file.
#
# Quick start:
#   cp .env.example .env                                   # set SESSION_SECRET + login
#   docker compose up -d                                   # app + ollama
#   docker compose --profile pull run --rm ollama-pull     # pull default models once
#   # open http://localhost:3848 and sign in with AUTH_DEFAULT_USERNAME/PASSWORD
#
# Without the models pulled, the app still runs — AI features simply stay hidden until
# a reachable Ollama has the models installed.

services:
  app:
    image: ghcr.io/companionintelligence/ci-planning:latest
    # To build locally instead of pulling the published image, comment `image` above
    # and uncomment the next line:
    # build: .
    restart: unless-stopped
    ports:
      - "3848:3848"
    volumes:
      - ci-planning-data:/data
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      AUTH_MODE: sso
      DISABLE_OIDC: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      AUTH_DEFAULT_USERNAME: ${AUTH_DEFAULT_USERNAME:?set AUTH_DEFAULT_USERNAME in .env}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:?set AUTH_DEFAULT_PASSWORD in .env}
      # In-network service name — the app reaches the ollama service over the compose network.
      OLLAMA_URL: http://ollama:11434
      # Postgres (schema port). Unset ⇒ the app still uses the SQLite store at /data —
      # the two backends coexist while the 386 call sites are migrated file by file.
      DATABASE_URL: postgres://${POSTGRES_USER:-planning}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-planning}
      # Error reporting (Sentry) — opt-OUT: ON wherever a DSN is set. Each of these is
      # empty unless set in .env, and an empty value is treated as unset: with no
      # SENTRY_DSN the server initialises no Sentry and opens no outbound connection at
      # all — an unconfigured stack, not an opted-out one. An empty CI_TELEMETRY means
      # "the DSN decides", NOT "off".
      # CI_TELEMETRY=off (which is what the app-store "Share crash reports" toggle sets)
      # and CI_LOCAL_ONLY=true each disable reporting even when a DSN IS present, so a
      # user or operator can switch it off without rebuilding the image.
      # The browser DSN is baked in at image-BUILD time and is not settable here —
      # see the Dockerfile's ARG VITE_SENTRY_DSN and docs/operations/error-reporting.md.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      CI_PLANNING_ENVIRONMENT: ${CI_PLANNING_ENVIRONMENT:-}
      CI_PLANNING_VERSION: ${CI_PLANNING_VERSION:-}
      CI_TELEMETRY: ${CI_TELEMETRY:-}
      CI_LOCAL_ONLY: ${CI_LOCAL_ONLY:-}
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Liveness comes from the Dockerfile HEALTHCHECK (hits /api/health).

  # Postgres for the schema port (db/postgres/migrations). pgvector is the sqlite-vec
  # replacement — possible-task dedupe builds a transient KNN index and needs the
  # extension present even though no column stores a vector.
  #
  # Pinned to the same major CI-Server runs so a later "one instance, two schemas"
  # deployment is a connection-string change rather than an upgrade. When pointing this
  # app at a SHARED instance, drop this service and set DATABASE_URL to that host —
  # `planning` is a schema, so it coexists with CI-Server's `ci` in one database.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planning}
      POSTGRES_USER: ${POSTGRES_USER:-planning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ci-planning-pg:/var/lib/postgresql/data
    # No host port by default — the app reaches it in-network. Uncomment to inspect with
    # psql from the host:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planning} -d ${POSTGRES_DB:-planning}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama # persists pulled models across restarts
    # The app reaches Ollama in-network; no host port is needed. Uncomment to reach it
    # from the host (e.g. `ollama list` against localhost) for debugging:
    # ports:
    #   - "11434:11434"
    # GPU passthrough (NVIDIA + nvidia-container-toolkit) — uncomment to accelerate:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      # `ollama list` answers only once the daemon is up → marks the service healthy,
      # which gates the app's depends_on.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot helper to pull the default models (config.ts defaults). Behind the `pull`
  # profile so a plain `docker compose up` never triggers multi-GB downloads. Run once:
  #   docker compose --profile pull run --rm ollama-pull
  # Bringing your own models? Skip this and set OLLAMA_SMALL / OLLAMA_MEDIUM / OLLAMA_EMBED
  # on the app service to any name already in `ollama list`.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["pull"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull qwen2.5:0.5b &&
       ollama pull gemma3n:e4b &&
       ollama pull nomic-embed-text"

volumes:
  ci-planning-data:
  ci-planning-pg:
  ollama-data:
