# Triality (design §8) — the suggestion read + outcome write, GraphQL twin of
# routes/triality.ts over the SAME service layer (parity by construction; a
# behavioral divergence from REST is a bug by definition). Flag-off surfaces as
# a NOT_FOUND error, matching the routes' 404 posture.
#
# `Motivation` is task.graphql's enum — one vocabulary, reused not redefined.

enum TrialitySlot { HABITUAL CONTEXTUAL NOVEL }
"Who authored the rationale line (T9, §8). TEMPLATE is the deterministic spec; AI means a local-model line replaced it."
enum RationaleSource { AI TEMPLATE }
enum TrialityOutcome { OPENED STAGED DISMISSED }
enum TrialityActionKind { TASK ROUTINE FLIGHT TEMPLATE }

type TrialityScores {
  f: Float!
  h: Float!
  q: Float!
  n: Float!
  c: Float!
  total: Float!
}

enum TrialityConfidenceBand { FIRM TENTATIVE GUESS }

"Which level of the lexicographic key [dot, S, id] separated the winner from the runner-up. UNCONTESTED = nothing else was eligible, so there was no comparison at all. TIE = the id order decided, which is a coin flip."
enum TrialityMarginBasis { UNCONTESTED DOT SCORE TIE }

enum TrialityConfidenceComponent { COVERAGE MARGIN EVIDENCE }

type TrialityConfidenceCounts {
  "Non-zero dims among meta.active, and |meta.active| — the ratio never travels without its denominator."
  dimsInformative: Int!
  dimsActive: Int!
  "Completions matching this candidate in the 90-day window. UNCAPPED."
  evidenceRows: Int!
  "Candidates this slot chose among, after the veto and after earlier slots took theirs."
  eligible: Int!
}

"Derived, deterministic, reported — and never fed back into ranking (v2 design §4)."
type TrialityConfidence {
  band: TrialityConfidenceBand!
  "min(coverage, margin, evidence) — the WEAKEST LINK, never an average."
  value: Float!
  "How many situation dims are pulling in a direction. NOT how much was sensed: a quiet day and an unread day read the same."
  coverage: Float!
  "How decisively this won ITS slot, on the key the engine actually compares."
  margin: Float!
  "How much 90-day completion history backs this candidate's H."
  evidence: Float!
  marginBasis: TrialityMarginBasis!
  "Which component set the minimum — the one the hedging copy names."
  binding: TrialityConfidenceComponent!
  counts: TrialityConfidenceCounts!
  "Confidence model version. Bumped when a constant or formula changes, so calibration can refuse to mix two models."
  v: Int!
}

type TrialityPick {
  slot: TrialitySlot!
  actionKind: TrialityActionKind!
  actionRef: ID!
  title: String!
  estimateMin: Int
  direction: String
  categories: [String!]!
  motivation: Motivation
  scores: TrialityScores!
  "The [normality, pragmatism, capacity] triple the slot targets dot against."
  ternary: [Int!]!
  "Non-null by contract: every rendered pick carries one (v2.2 §4)."
  confidence: TrialityConfidence!
  "triality_log row id for this shown event — feed it to trialityFeedback."
  logId: ID
  "One short 'why now' line. Non-null by contract: the deterministic template always exists, so a pick is never unexplained."
  rationale: String!
  "Never rendered unlabeled — the honesty idiom carries the source to the UI."
  rationaleSource: RationaleSource!
}

type TrialityRefusal {
  reason: String!
  have: Int!
  need: Int!
}

type TrialityNextPayload {
  "Set when there is not enough confirmed history to rank honestly (§4 floor)."
  refused: TrialityRefusal
  "Exactly three entries when not refused — habitual, contextual, novel order; a null entry is an honestly-empty slot."
  picks: [TrialityPick]
  "slot → why it rendered empty (only for null entries)."
  emptyReasons: JSON
  "The situation vector used — dims and which were active (the explanation)."
  vector: JSON
  computedAt: DateTime
}

type TrialityFeedbackPayload {
  "False when the row was already stamped (once-only, append-only discipline)."
  changed: Boolean!
  success: Boolean!
}

extend type Query {
  trialityNext: TrialityNextPayload!
}

extend type Mutation {
  trialityFeedback(logId: ID!, outcome: TrialityOutcome!): TrialityFeedbackPayload!
}
