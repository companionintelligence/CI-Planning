# Phase W · W3.3b — TaskType. CRUD ALONGSIDE the REST /api/tasks routes; every field
# and mutation reads/writes through services/tasks.ts (Decision 3), never re-deriving
# owner-scoping against the DB (re-derivation is how this phase's IDOR bugs appeared).
#
# `implements Node & Taggable` (W4a): the `tags` forward edge reads the tags applied to
# this task (entity_tags, all levels). EntityTagType.taggedAt is now backed by
# entity_tags.created_at (migration 0110). The reverse edge (TagType.entities) is W4b.
# `objective` (the first objective this task is linked to, over objective_tasks) landed
# once ObjectiveType existed (W8a) — a nullable field, owner-scoped in services/objectives.ts.
#
# `status` is a plain String, NOT an enum: tasks.status is a free-form TEXT column with
# no CHECK, and code writes at least open/scheduled/in_progress/done/cancelled/deferred/
# recurring/skipped/missed (schema.ts:55 + block-task-sync/recurrence/review writers). A
# DB value outside a GraphQL enum throws at serialization, so String is the correct,
# leak-proof choice here (the schema doc's 5-value enum is known-incomplete).
#
# `scheduledFor` is a LOCAL YYYY-MM-DD date string kept as String (not DateTime) so
# clients don't misinterpret it as an instant and shift it across timezones.

enum TaskSubtype { STANDARD HABIT QUICK }

# Motivation axis (0141, design §3b): who the work is for. Nullable — NULL means
# UNLABELED, which is deliberately distinct from US (shared benefit): "never asked"
# is not a kind of "both". Source discloses whose testimony the label is; a USER
# label wins permanently (machine passes never re-tag).
enum Motivation { ME US THEM }
enum MotivationSource { USER LLM }

type TaskType implements Node & Taggable {
  id: ID!
  title: String!
  notes: String
  status: String!
  priority: Int!
  subtype: TaskSubtype!
  estimatedMinutes: Int
  dueAt: DateTime
  scheduledFor: String              # local YYYY-MM-DD, not an instant — String, not DateTime
  createdAt: DateTime!
  completedAt: DateTime
  parent: TaskType                  # parent_id
  subtasks(first: Int, after: String): TaskConnection!   # forward-only (last/before unimplemented → omitted)
  dependsOn: [TaskType!]!           # task_dependencies.depends_on_id
  tags: [EntityTagType!]!           # W4a: tags applied to this task (entity_tags, all levels)
  # Phase B (0134): the task's 1–3 category NAMES, position order (stripe order).
  categories: [String!]!
  # Phase B (0135): per-element texture override.
  textureEnabled: Boolean!
  textureColorToken: String
  # Motivation axis (0141): null = unlabeled (≠ US — see the enum note above).
  #
  # As of 0151 this is a PROJECTION of `beneficiaries`, not a hand-set field: the
  # server derives it on every beneficiary write (empty set ⇒ null, self-only ⇒ ME,
  # self+others ⇒ US, others-only ⇒ THEM). Still writable through updateTask for API
  # back-compat, but the wizard sends the people set instead.
  motivation: Motivation
  motivationSource: MotivationSource
  # People on work (0151). Two peer sets over ONE type: who does the work, and who the
  # work is for. Position-ordered; index 0 of `responsible` is the lead.
  responsible: [PersonType!]!
  beneficiaries: [PersonType!]!
  objective: ObjectiveType          # the first objective this task is linked to (objective_tasks, linked=1); null if none
}

type TaskConnection implements Connection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TaskEdge implements Edge {
  cursor: String!
  node: TaskType!
}

input CreateTaskInput {
  title: String!
  notes: String
  priority: Int
  subtype: TaskSubtype
  estimatedMinutes: Int
  dueAt: DateTime
  scheduledFor: String
  parentId: ID
  tags: [String!]
  secondaryTags: [String!]
  "Phase B: 1–3 category NAMES (array order = stripe order)."
  categories: [String!]
  textureEnabled: Boolean
  textureColorToken: String
  "Motivation (0141): a caller-supplied value is user testimony (source stamps USER)."
  motivation: Motivation
  "People on work (0151): person ids, array order = position (index 0 = the lead)."
  responsibleIds: [ID!]
  "Person ids. Setting this DERIVES `motivation` — send one or the other, not both."
  beneficiaryIds: [ID!]
  dependsOn: [ID!]
  # NOTE: no `recurrenceRule` — recurring creation (the REST POST's createRecurringTask
  # branch) is out of scope for W3.3b; omitted so a rule can't be passed-and-ignored.
  # A recurring-create mutation is deferred to a later ticket.
}

input UpdateTaskInput {
  id: ID!
  title: String
  notes: String
  status: String
  priority: Int
  subtype: TaskSubtype
  estimatedMinutes: Int
  dueAt: DateTime
  scheduledFor: String
  completedAt: DateTime
  completed: Boolean
  parentId: ID
  tags: [String!]
  secondaryTags: [String!]
  "Phase B: category NAMES — absent preserves, [] clears (mirrors tags)."
  categories: [String!]
  textureEnabled: Boolean
  textureColorToken: String
  "Motivation (0141): absent preserves; explicit null un-labels (clears source too)."
  motivation: Motivation
  "People on work (0151): absent preserves, [] clears (mirrors tags)."
  responsibleIds: [ID!]
  "Absent preserves, [] clears — and re-derives `motivation`, including back to null."
  beneficiaryIds: [ID!]
  dependsOn: [ID!]
}

type CreateTaskPayload {
  task: TaskType
  success: Boolean!
}

type UpdateTaskPayload {
  task: TaskType
  success: Boolean!
}

extend type Query {
  task(id: ID!): TaskType
  tasks(first: Int, after: String, status: String): TaskConnection!
}

extend type Mutation {
  createTask(input: CreateTaskInput!): CreateTaskPayload!
  updateTask(input: UpdateTaskInput!): UpdateTaskPayload!
  # Reuses the shared DeleteByIdInput/DeleteByIdPayload declared in tag.graphql.
  deleteTask(input: DeleteByIdInput!): DeleteByIdPayload!
}
