# Phase W — TagType (Decision 6). CI-Server-compatible core (Node · id · label ·
# description) plus CI-Planner's additive tag-taxonomy: `kind`, `muted`, `isBase`, and the
# hierarchy exposed as Relay connections on the same type rather than new top-level types.
#
# Vocabulary note: `kind` mirrors the LIVE DB value `tags.kind` — DIRECTION for the
# top-level grouping axis (Work / Life / Home). Phase Z / W2 reverted the mistaken
# 0038/0043 PATTERN rename back to DIRECTION across the whole stack (DB + this enum +
# edge names) atomically; "pattern" now names only the day-arrangement (pattern_blocks).
# `TagType.entities` (tag→tagged Task/TimeBlock) is deferred to the core-entities slice,
# which introduces those Taggable types.

enum TagKind {
  DIRECTION
  INTENTION
  CATEGORY
}

type TagType implements Node {
  id: ID!
  label: String!            # resolver maps the DB column `name` → label
  description: String       # no column yet — always null until one is added
  kind: TagKind!
  muted: Boolean!
  isBase: Boolean!
  # Hierarchy as relationship connections. Which are populated depends on `kind`:
  # an INTENTION has parentDirections + parentCategories; a DIRECTION or CATEGORY has
  # childIntentions. Unpopulated edges return an EMPTY connection, never an error.
  parentDirections(first: Int, after: String): TagConnection!
  parentCategories(first: Int, after: String): TagConnection!
  childIntentions(first: Int, after: String): TagConnection!
  # W4b — the reverse tagging edge: the Tasks/TimeBlocks this tag is applied to (over
  # entity_tags), the mirror of Taggable's forward `tags`. `kind` filters to one entity
  # type; routine-tagged rows are excluded (RoutineType doesn't exist until W6). Owner-
  # scoped in the service (each branch joins the owned tasks/time_blocks table).
  entities(first: Int, after: String, kind: EntityKindFilter): TaggedEntityConnection!
}

# W4b — a tag's tagged entities span two concrete Node types (both TaskType and
# TimeBlockType `implement Node`). Routines are omitted until W6 adds RoutineType.
union TaggedEntity = TaskType | TimeBlockType

enum EntityKindFilter { TASK TIME_BLOCK }

# This connection/edge deliberately DO NOT declare `implements Connection`/`Edge`: a
# graphql-js interface field is covariant only for object/interface subtypes, never a
# union, so an `Edge.node: Node!` cannot be narrowed to `TaggedEntity!` (schema-build
# error). The precise union return type is worth more here than nominal interface
# conformance — the field shape is still Relay-standard (cursor + node · edges/pageInfo/
# totalCount), so clients paginate it identically.
type TaggedEntityConnection {
  edges: [TaggedEntityEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TaggedEntityEdge {
  cursor: String!
  node: TaggedEntity!
}

type TagConnection implements Connection {
  edges: [TagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TagEdge implements Edge {
  cursor: String!
  node: TagType!
}

input CreateTagInput {
  label: String!
  kind: TagKind
}

input UpdateTagInput {
  id: ID!
  label: String
  muted: Boolean
}

# Shared delete shape (mirrors CI-Server's DeleteByIdInput/DeleteByIdPayload convention).
input DeleteByIdInput {
  id: String!
}

type CreateTagPayload {
  tag: TagType
  success: Boolean!
}

type UpdateTagPayload {
  tag: TagType
  success: Boolean!
}

type DeleteByIdPayload {
  deletedId: ID
  success: Boolean!
}

extend type Query {
  tag(id: ID!): TagType
  tags(first: Int, after: String, kind: TagKind): TagConnection!
}

type Mutation {
  createTag(input: CreateTagInput!): CreateTagPayload!
  updateTag(input: UpdateTagInput!): UpdateTagPayload!
  deleteTag(input: DeleteByIdInput!): DeleteByIdPayload!
}
