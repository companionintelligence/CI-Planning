# Phase W · W3.3c — TimeBlockType. CRUD ALONGSIDE the REST /api/blocks routes; every
# field and mutation reads/writes through services/blocks.ts (Decision 3), never
# re-deriving owner-scoping against the DB (re-derivation is how this phase's IDOR bugs
# appeared).
#
# `implements Node & Taggable` (W4a): the `tags` forward edge reads the tags applied to
# this block (entity_tags, all levels — distinct from the denormalized top-level
# `time_blocks.tag` mirror). EntityTagType.taggedAt is now backed by entity_tags.created_at
# (migration 0110). The reverse edge (TagType.entities) is W4b. No `objective` on blocks.
#
# `status` and `blockKind` are plain String, NOT enums: time_blocks.status /.block_kind
# are free-form TEXT columns with no CHECK (status: planned/completed/skipped/overrun;
# block_kind: task/meeting/habit/focus/break/buffer/timeblock). A DB value outside a
# GraphQL enum throws at serialization, so String is the correct, leak-proof choice
# (same call TaskType made for `status`).

type TimeBlockType implements Node & Taggable {
  id: ID!
  title: String!
  blockKind: String!
  startAt: DateTime!
  endAt: DateTime!
  allDay: Boolean!
  isLocked: Boolean!
  isAuto: Boolean!
  status: String!
  createdAt: DateTime!
  note: String
  blockType: String
  durationMinutes: Int
  colorToken: String
  # Phase B (0135): per-element texture override (default resolvers over the columns).
  textureEnabled: Boolean!
  textureColorToken: String
  # Relations (owner-scoped field resolvers; null when the FK is unset).
  task: TaskType                    # task_id
  parentBlock: TimeBlockType        # parent_block_id
  # Phase B: FIRST effective category (own entity_categories → task's → legacy category_id).
  category: TagType
  # Phase B: effective category NAMES, position order (own rows, else the task's — the
  # same derive rule as REST's `categories`).
  categories: [String!]!
  tags: [EntityTagType!]!           # W4a: tags applied to this block (entity_tags, all levels)
  # People on work (0151). A block carries both sets natively; a task-backed block with
  # none of its own INHERITS its task's (each set independently) — the same
  # own-else-derive rule categories follow, so re-assigning a task re-labels its blocks
  # with no engine writes.
  responsible: [PersonType!]!
  beneficiaries: [PersonType!]!
}

type TimeBlockConnection implements Connection {
  edges: [TimeBlockEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type TimeBlockEdge implements Edge {
  cursor: String!
  node: TimeBlockType!
}

input CreateTimeBlockInput {
  title: String!
  taskId: ID
  blockKind: String
  tag: String
  secondaryTags: [String!]
  blockType: String
  goalStartDate: String
  durationMinutes: Int
  note: String
  startAt: DateTime!
  endAt: DateTime!
  isLocked: Boolean
  allDay: Boolean
  "Attach to a Plan container (block_kind='timeblock') you own, in the same call. Null/absent = loose."
  parentBlockId: ID
  recurrenceRule: String
  recurrenceDtstart: String
  "LEGACY single category id — bridged to `categories` (entity_categories); prefer `categories`."
  categoryId: ID
  "Phase B: 1–3 category NAMES (array order = stripe order). Wins over categoryId."
  categories: [String!]
  colorToken: String
  textureEnabled: Boolean
  textureColorToken: String
}

input UpdateTimeBlockInput {
  id: ID!
  title: String
  startAt: DateTime
  endAt: DateTime
  isLocked: Boolean
  status: String
  blockKind: String
  tag: String
  blockType: String
  goalStartDate: String
  durationMinutes: Int
  note: String
  allDay: Boolean
  parentBlockId: ID
  secondaryTags: [String!]
  recurrenceRule: String
  recurrenceDtstart: String
  "LEGACY single category id (null clears) — bridged to `categories`; prefer `categories`."
  categoryId: ID
  "Phase B: category NAMES — absent preserves, [] clears (mirrors tags)."
  categories: [String!]
  textureEnabled: Boolean
  textureColorToken: String
}

# Shift a Plan + all its members by one minute delta, atomically (PR-C). `id` may be the
# Plan (blockKind='timeblock') OR any member; the group is resolved the same way.
input MoveBlockGroupInput {
  id: ID!
  deltaMinutes: Int!
}

# Turn a Concept into a scheduled Plan. end defaults to start + the concept's duration.
input PromoteBlockInput {
  id: ID!
  startAt: DateTime!
  endAt: DateTime
  allDay: Boolean
}

# Deleting a Plan detaches its members by default (they survive as loose task blocks);
# deleteChildren removes them too (the "remove tasks" confirm-dialog choice).
input DeleteTimeBlockInput {
  id: ID!
  deleteChildren: Boolean
}

type CreateTimeBlockPayload {
  timeBlock: TimeBlockType
  success: Boolean!
}

type UpdateTimeBlockPayload {
  timeBlock: TimeBlockType
  success: Boolean!
}

type MoveBlockGroupPayload {
  timeBlocks: [TimeBlockType!]!
  parentId: ID!
  success: Boolean!
}

type PromoteBlockPayload {
  timeBlock: TimeBlockType
  success: Boolean!
}

extend type Query {
  timeBlock(id: ID!): TimeBlockType
  # `from`/`to`/`state` filter (mirror REST GET /api/blocks — recurring instances
  # materialize, templates drop); `first`/`after` paginate forward on id.
  timeBlocks(first: Int, after: String, from: String, to: String, state: String): TimeBlockConnection!
}

extend type Mutation {
  createTimeBlock(input: CreateTimeBlockInput!): CreateTimeBlockPayload!
  updateTimeBlock(input: UpdateTimeBlockInput!): UpdateTimeBlockPayload!
  moveBlockGroup(input: MoveBlockGroupInput!): MoveBlockGroupPayload!
  promoteBlockToScheduled(input: PromoteBlockInput!): PromoteBlockPayload!
  # Reuses the shared DeleteByIdPayload; uses its own DeleteTimeBlockInput for deleteChildren.
  deleteTimeBlock(input: DeleteTimeBlockInput!): DeleteByIdPayload!
}
