<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Companion Planning social card (source for site/og-image.png)</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0a6358;
    color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .copy { position: absolute; left: 72px; top: 118px; width: 470px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; }
  h1 { font-size: 62px; line-height: 1.04; letter-spacing: -0.02em; margin: 40px 0 24px; }
  p { margin: 0; font-size: 28px; line-height: 1.35; color: #c5e8dc; }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 24px; color: #c5e8dc; }
  .shot {
    position: absolute; right: 48px; top: 134px; width: 560px;
    border-radius: 22px; overflow: hidden; border: 6px solid #084d45;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
  }
  .shot img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../site/apple-touch-icon.png" alt="">Companion Planning</div>
    <h1>Plan your day on a server you control</h1>
    <p>A private planner for tasks, time blocks and your day.</p>
  </div>
  <div class="shot"><img src="../../site/img/today-dark.webp" alt=""></div>
  <div class="url">planning.ci.computer</div>
</body>
</html>
