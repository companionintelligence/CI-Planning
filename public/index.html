<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI TODO Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">AI TODO Dashboard</h1>
      <div class="header-actions">
        <button id="refresh-btn" title="Refresh">🔄</button>
        <span id="status"></span>
      </div>
    </header>
    
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>📁 Files</h2>
        </div>
        <div id="file-tree"></div>
      </aside>
      
      <main class="content">
        <div id="file-header" class="file-header hidden">
          <span id="current-file"></span>
          <button id="edit-btn" title="Open in editor">📝 Edit</button>
        </div>
        <div id="markdown-content" class="markdown-body">
          <div class="welcome">
            <h2>Welcome to AI TODO Dashboard</h2>
            <p>Select a markdown file from the sidebar to view and manage todos.</p>
          </div>
        </div>
      </main>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
