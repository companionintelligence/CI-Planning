<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#2a4ecc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Page glyph -->
  <rect x="128" y="108" width="256" height="320" rx="28" fill="rgba(255,255,255,0.18)" filter="url(#soft)"/>
  <rect x="128" y="108" width="256" height="320" rx="28" fill="rgba(255,255,255,0.10)"/>
  <!-- Three task lines, last one checked -->
  <g stroke="rgba(255,255,255,0.95)" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="172" y1="186" x2="340" y2="186"/>
    <line x1="172" y1="260" x2="340" y2="260"/>
    <line x1="172" y1="334" x2="340" y2="334"/>
  </g>
  <!-- Big checkmark anchor -->
  <g transform="translate(212 268)">
    <rect x="-12" y="-12" width="96" height="96" rx="20" fill="#9ece6a"/>
    <path d="M -2 36 L 30 64 L 78 12" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
